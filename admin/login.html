<html lang="en"><head>

</head><body class="login-page">
  <main class="login-layout">
    <section class="login-photo" aria-label="Prince B Realty Consult">
      <img class="login-property" src="./assets/property.avif" alt="Modern residential property">
      <a class="login-brand website-link" href="https://jaydeladem.github.io/prince-b-realty-consult/"><img src="./assets/logo.png" alt="Prince B Realty Consult"></a>
      <div class="login-photo-copy"><p class="eyebrow">YOUR NEXT CHAPTER STARTS HERE</p><h1>A place for<br>new possibilities.</h1><p>Thoughtful property advice.<br>Trusted relationships. Lasting value.</p></div>
      <p class="login-photo-footer">PRINCE B REALTY CONSULT · GHANA</p>
    </section>
    <section class="login-form-panel">
      <div class="login-form-frame">
      <a class="mobile-brand website-link" href="https://jaydeladem.github.io/prince-b-realty-consult/"><img src="./assets/logo.png" alt="Prince B Realty Consult"></a>
      <div class="login-form-content">
        <p class="eyebrow">STAFF PORTAL</p><h2>Staff sign in</h2>
        <p id="feedback" class="feedback" role="status" aria-live="polite" hidden></p>

          <button class="button sign-in-submit" type="submit" disabled>Connecting…</button>
        </form>
        <p class="access-note">Contact your administrator for access.</p><a class="back-link website-link" href="https://jaydeladem.github.io/prince-b-realty-consult/">Back to website</a>
      </div>
      <p class="login-legal">Prince B Realty Consult · Staff access only</p>
      </div>
